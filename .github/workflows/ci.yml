name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test timeline and live-task behavior
        run: node --test tests/web/*.test.mjs
      - name: Test packaging
        run: python3 -m unittest discover -s tests/packaging -v
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.TaskTimeline.sln
      - name: Check formatting
        run: dotnet format Jellyfin.Plugin.TaskTimeline.sln --no-restore --verify-no-changes
      - name: Build
        run: dotnet build Jellyfin.Plugin.TaskTimeline.sln --configuration Release --no-restore
      - name: Test forecast behavior and API authorization
        run: dotnet test Jellyfin.Plugin.TaskTimeline.sln --configuration Release --no-build
      - name: Check diagnostic formatting
        env:
          TaskTimelineDiagnostics: 'true'
        run: dotnet format Jellyfin.Plugin.TaskTimeline.sln --no-restore --verify-no-changes
      - name: Build development-only diagnostic
        run: dotnet build Jellyfin.Plugin.TaskTimeline.sln --configuration Release --no-restore -p:TaskTimelineDiagnostics=true
      - name: Confirm normal build excludes diagnostics
        run: |
          dotnet publish src/Jellyfin.Plugin.TaskTimeline/Jellyfin.Plugin.TaskTimeline.csproj --configuration Release --no-restore --output artifacts/standard
          python3 - <<'PY'
          from pathlib import Path
          assembly = Path('artifacts/standard/Jellyfin.Plugin.TaskTimeline.dll').read_bytes()
          for marker in (b'Jellyfin.Plugin.TaskTimeline.Web.timeline.html', b'Jellyfin.Plugin.TaskTimeline.Web.timeline.js', b'Jellyfin.Plugin.TaskTimeline.Web.timeline-model.js', b'Jellyfin.Plugin.TaskTimeline.Web.task-updates.js'):
              if marker not in assembly:
                  raise SystemExit('Normal build is missing a timeline resource')
          for marker in (b'ProgressDiagnosticTask', b'IndeterminateDiagnosticTask', b'Jellyfin.Plugin.TaskTimeline.Web.Diagnostics'):
              if marker in assembly:
                  raise SystemExit('Normal build unexpectedly includes diagnostic code or resources')
          PY
