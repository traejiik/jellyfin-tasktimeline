name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test packaging
        run: python3 -m unittest discover -s tests/packaging -v
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.TaskTimeline.sln
      - name: Check formatting
        run: dotnet format Jellyfin.Plugin.TaskTimeline.sln --no-restore --verify-no-changes
      - name: Build
        run: dotnet build Jellyfin.Plugin.TaskTimeline.sln --configuration Release --no-restore
